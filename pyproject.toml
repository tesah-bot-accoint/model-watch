[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-watch"
version = "0.2.0"
description = "Chat with Gemma and watch each word form: per-layer guesses and concepts at four depths."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "transformers>=4.50", "huggingface_hub>=0.23", "safetensors>=0.4", "numpy>=1.24"]

[tool.setuptools]
packages = ["model_watch"]

[tool.setuptools.package-data]
model_watch = ["viewer.html"]
